services:
  postgres:
    image: postgres:16-alpine
    container_name: happyhour-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: happyhour
      POSTGRES_PASSWORD: happyhour_dev
      POSTGRES_DB: happyhour
    ports:
      - "5432:5432"
    volumes:
      - happyhour_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U happyhour"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  happyhour_pgdata:
